<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#6741d9"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes">
<title>Maths Puzzle Arcade</title><style>:root{--bg:#f4f2ff;--ink:#1f1a3d;--mut:#6b6690;--gc:#7c5cff}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0}
body{font-family:system-ui,-apple-system,"Segoe UI","PingFang TC","Microsoft JhengHei",sans-serif;background:var(--bg);color:var(--ink);min-height:100vh}
[hidden]{display:none!important}button{font-family:inherit;color:inherit}
.wrap{max-width:1000px;margin:0 auto;padding:18px 14px 50px}
.hero h1{font-size:clamp(28px,6vw,44px);margin:6px 0 2px;letter-spacing:-.5px}.hero p{margin:0 0 18px;color:var(--mut);font-size:17px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:16px}
.card{all:unset;box-sizing:border-box;cursor:pointer;background:#fff;border-radius:22px;padding:0 0 14px;box-shadow:0 5px 16px rgba(40,30,100,.1);display:flex;flex-direction:column;gap:6px;overflow:hidden;transition:transform .15s}
.card:hover{transform:translateY(-3px)}.card:active{transform:scale(.98)}
.card .art{height:120px;background:var(--c);display:flex;align-items:center;justify-content:center;font-size:44px;color:#fff;font-weight:900}
.card h3{margin:6px 16px 0;font-size:21px}.card p{margin:0 16px;color:var(--mut);font-size:15px;line-height:1.35}
.skills{margin:2px 16px;display:flex;flex-wrap:wrap;gap:6px}.skills span{background:#f0edff;color:#5b3fd6;border-radius:99px;padding:3px 10px;font-size:12.5px;font-weight:700}
.solved{margin:2px 16px 0;font-weight:800;font-size:14px;color:var(--c)}
.art b,.art i{font-style:normal}
.mini24{display:flex;gap:8px;align-items:center}.mini24 b{background:#fff;color:var(--c);width:54px;height:74px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:34px;transform:rotate(-6deg)}.mini24 b+b{transform:rotate(6deg)}.mini24 i{font-size:30px}
.minigrid{display:flex;gap:8px;align-items:center;font-size:34px}.minigrid b{background:#fff;color:var(--c);width:50px;height:50px;border-radius:12px;display:flex;align-items:center;justify-content:center}
.minikk{display:grid;grid-template-columns:repeat(2,50px);gap:3px}.minikk b{background:#fff;color:var(--c);height:50px;display:flex;align-items:center;justify-content:center;font-size:24px}.minikk b:first-child{border:3px solid #1f1a3d;font-size:18px}
.miniriver{font-size:44px;letter-spacing:6px}
.minikl{display:flex;gap:4px;align-items:center}.minikl i{width:40px;height:90px;background:#ffd9a8;border-radius:8px}.minikl b{width:84px;height:84px;background:#fff;color:var(--c);border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:26px}
/* game shell */
.gbar{background:var(--c);color:#fff;border-radius:20px;padding:12px 14px;display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:10px}
.gbar h2{margin:0;font-size:22px;flex:1;min-width:160px}.gemo{font-size:26px}
.back{border:0;background:rgba(255,255,255,.25);color:#fff;border-radius:12px;padding:8px 12px;font-weight:800;cursor:pointer;font-size:15px}
.pills{display:flex;gap:6px;flex-wrap:wrap}
.pill{border:0;background:rgba(255,255,255,.25);color:#fff;border-radius:10px;padding:7px 12px;font-weight:800;cursor:pointer}.pill.on{background:#fff;color:var(--c)}
.glv{font-weight:700;margin:2px 4px 2px;color:var(--mut)}.howto{background:#fff;border-radius:14px;padding:10px 14px;margin:6px 0 14px;color:var(--ink);font-size:15.5px;line-height:1.4;box-shadow:0 2px 8px rgba(40,30,100,.06)}
#groot{max-width:560px;margin:0 auto}
.btn{border:0;background:var(--gc);color:#fff;border-radius:12px;padding:11px 16px;font-size:16px;font-weight:800;cursor:pointer;box-shadow:0 3px 0 rgba(0,0,0,.15)}
.btn.alt{background:#fff;color:var(--ink);box-shadow:0 3px 0 #d8d3f5;border:2px solid #e6e2fa}.btn:active{transform:translateY(2px)}
.toolrow{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin:12px 0}.msg{min-height:26px;text-align:center;font-size:16px;margin:8px 0;color:#5a4b00}
.statrow{display:flex;justify-content:space-between;font-weight:800;margin:4px 6px 10px;color:var(--mut)}
.shake{animation:sh .35s}@keyframes sh{20%{transform:translateX(-7px)}40%{transform:translateX(7px)}60%{transform:translateX(-5px)}80%{transform:translateX(5px)}}
#toast{position:fixed;left:50%;bottom:30px;transform:translate(-50%,40px);background:#1f1a3d;color:#fff;padding:10px 18px;border-radius:99px;opacity:0;transition:.25s;z-index:60;font-weight:700;pointer-events:none}#toast.show{opacity:1;transform:translate(-50%,0)}
.overlay{position:fixed;inset:0;background:rgba(31,26,61,.55);display:flex;align-items:center;justify-content:center;z-index:50;padding:16px}
.modal{background:#fff;border-radius:24px;padding:24px;max-width:380px;text-align:center;animation:pop .35s}.modal h2{margin:4px 0}.modal p{color:var(--mut);margin:6px 0 16px}.big-emo{font-size:60px}.modal .row{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
@keyframes pop{0%{transform:scale(.6);opacity:0}100%{transform:scale(1);opacity:1}}
.confetti{position:fixed;inset:0;pointer-events:none;z-index:70}
.frac{display:inline-flex;flex-direction:column;align-items:center;font-size:.7em;line-height:1.05;vertical-align:middle}.frac span:first-child{border-bottom:3px solid currentColor;padding:0 6px 2px}
/* 24 */
.cards24{display:grid;grid-template-columns:repeat(auto-fit,minmax(90px,1fr));gap:12px;margin:8px 0 16px}
.card24{border:0;border-radius:18px;min-height:130px;color:#fff;font-size:clamp(36px,10vw,56px);font-weight:900;cursor:pointer;box-shadow:0 6px 0 rgba(0,0,0,.18);transition:transform .15s}
.card24.sel{transform:translateY(-10px) scale(1.05);outline:5px solid #ffd23f}.card24.pop{animation:pop .35s}
.ops24{display:flex;gap:10px;justify-content:center}.op24{width:70px;height:70px;border-radius:50%;border:3px solid var(--gc);background:#fff;color:var(--gc);font-size:34px;font-weight:900;cursor:pointer}.op24.sel{background:var(--gc);color:#fff}
/* grid */
.ng-board{display:grid;gap:6px;justify-content:center;align-items:center;margin:8px auto;width:max-content;max-width:100%}
.ng-cell{width:62px;height:62px;border-radius:14px;border:3px dashed #b9aef0;background:#faf8ff;font-size:32px;font-weight:900;cursor:pointer;color:var(--ink)}.ng-cell.f{border:3px solid var(--gc);background:#fff}.ng-cell.lk{background:#efeaff}
.ng-op{text-align:center;font-size:30px;font-weight:900;color:var(--mut);min-width:26px}
.ng-res{min-width:58px;height:46px;border-radius:12px;background:#ece8ff;display:flex;align-items:center;justify-content:center;font-size:24px;font-weight:900}.ng-res.ok{background:#c9f2d7;color:#14733a}.ng-res.bad{background:#ffd6d6;color:#b3262b}
.tray{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin:14px 0}
.tile{width:54px;height:54px;border-radius:14px;border:0;background:var(--gc);color:#fff;font-size:26px;font-weight:900;cursor:pointer;box-shadow:0 4px 0 rgba(0,0,0,.18)}.tile.used{opacity:.25}.tile.sel{outline:4px solid #ffd23f;transform:translateY(-4px)}.tile.alt{background:#fff;color:var(--ink);box-shadow:0 4px 0 #d8d3f5;border:2px solid #e6e2fa}
/* kenken */
.kk-board{display:grid;margin:8px auto;width:max-content;border:3px solid #1f1a3d;background:#fff}
.kk-cell{width:var(--cs);height:var(--cs);position:relative;border:1px solid #d8d3f5;display:flex;align-items:center;justify-content:center;cursor:pointer;user-select:none}
.kk-cell.bt{border-top:3px solid #1f1a3d}.kk-cell.bb{border-bottom:3px solid #1f1a3d}.kk-cell.bl{border-left:3px solid #1f1a3d}.kk-cell.br{border-right:3px solid #1f1a3d}
.kk-cell.dup .kk-v{color:#e5484d}.kk-cell.cok .kk-lab{color:#14733a}.kk-cell.cbad .kk-lab{color:#e5484d}.kk-cell.giv .kk-v{color:#2a6cc0}.kk-cell.sel{outline:4px solid #ffd23f;outline-offset:-4px;z-index:2}
.k0{background:#fff3e6}.k1{background:#e8f1ff}.k2{background:#eaf9ef}.k3{background:#fdeefa}.k4{background:#fffbe0}.k5{background:#efeaff}.k6{background:#e6f8f8}
.kk-lab{position:absolute;top:2px;left:4px;font-size:calc(var(--cs)*.2);font-weight:900;color:#1f1a3d}
.kk-v{font-size:calc(var(--cs)*.5);font-weight:900}.kk-n{font-size:calc(var(--cs)*.2);color:#5b5780;text-align:center;line-height:1.1;max-width:80%;margin-top:10px}
/* river */
.rv-rule{background:#fff8e1;border-radius:12px;padding:8px 12px;font-size:14.5px;margin-bottom:8px}
.rv-scene{display:grid;grid-template-columns:1fr 1.1fr 1fr;gap:0;min-height:300px;border-radius:18px;overflow:hidden;box-shadow:0 4px 12px rgba(0,0,0,.12)}
.rv-scene.fail{animation:sh .5s}
.bank{background:linear-gradient(#8fd37a,#5cb85c);padding:8px;display:flex;flex-direction:column;gap:6px;justify-content:center;align-items:center}
.river{position:relative;background:linear-gradient(#4fb6f0,#2a8bd4);overflow:hidden}
.waves{position:absolute;inset:0;background:repeating-linear-gradient(0deg,transparent 0 22px,rgba(255,255,255,.18) 22px 25px);animation:wv 3s linear infinite}@keyframes wv{to{background-position:0 50px}}
.boatw{position:absolute;top:34%;width:104px;transition:left .9s ease-in-out;text-align:center}.boatw.l{left:4px}.boatw.r{left:calc(100% - 108px)}
.hull{font-size:54px;line-height:1;margin-top:-8px}.boatcargo{display:flex;flex-direction:column;align-items:center;gap:3px;min-height:20px}
.rv-it{border:0;background:rgba(255,255,255,.88);border-radius:12px;padding:3px 6px;display:flex;align-items:center;gap:5px;cursor:default;min-width:88px;box-shadow:0 2px 0 rgba(0,0,0,.15)}
.rv-it.can,.rv-it.inb{cursor:pointer;outline:2px solid #ffd23f}.rv-it .e{font-size:30px}.rv-it .nm{font-size:12px;font-weight:800;text-align:left;line-height:1.15}
.rv-hud{display:flex;justify-content:space-between;font-weight:700;margin:10px 4px 0;font-size:15px}.rv-hud small{color:var(--mut)}
.btn.go{background:#2eaa5e;font-size:20px;padding:12px 28px}
/* klotski */
.kl-wrap{display:flex;flex-direction:column;align-items:flex-start;width:max-content;margin:0 auto}
.kl-board{position:relative;background:#6b3f1d;border:6px solid #3c2210;border-radius:10px;box-sizing:content-box;touch-action:none;background-image:repeating-linear-gradient(0deg,rgba(0,0,0,.08) 0 2px,transparent 2px 7px)}
.kl-exit{height:20px;margin-top:2px;margin-left:calc(var(--cs,0px));background:repeating-linear-gradient(45deg,#ffd23f 0 8px,#1f1a3d 8px 16px);color:#1f1a3d;font-size:12px;font-weight:900;display:flex;align-items:center;justify-content:center;border-radius:0 0 8px 8px}.kl-exit{color:#fff;text-shadow:0 0 3px #000}
.kl-piece{position:absolute;transition:left .12s,top .25s,opacity .4s;touch-action:none;cursor:grab}
.kl-p{position:absolute;inset:3px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:clamp(14px,4.2vw,22px);color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.4);box-shadow:inset 0 -4px 0 rgba(0,0,0,.2);user-select:none;writing-mode:horizontal-tb}
.kl-p.cao{background:linear-gradient(#ff6b5a,#d62f2f);font-size:28px}.kl-p.gen{background:linear-gradient(#4a9fe8,#2a6cc0)}.kl-p.sol{background:linear-gradient(#e0b878,#b8864a);color:#fff}
.kl-piece.sel .kl-p{outline:4px solid #ffd23f}
@media(max-width:480px){.ng-cell{width:54px;height:54px}.rv-it .nm{font-size:11px}.rv-it{min-width:76px}.boatw{width:92px}.boatw.r{left:calc(100% - 96px)}}
/* v2 shell */
.cats{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 14px}.cat{border:2px solid #d8d3f5;background:#fff;border-radius:99px;padding:7px 14px;font-weight:800;cursor:pointer;font-size:14.5px}.cat.on{background:#1f1a3d;color:#fff;border-color:#1f1a3d}
.overall{color:var(--mut);font-weight:700;margin:-8px 0 12px}
.card .art{position:relative}.tag{position:absolute;top:10px;right:10px;background:rgba(0,0,0,.28);color:#fff;font-size:12px;font-weight:800;border-radius:99px;padding:3px 10px}
.pbar{height:8px;background:#ece8ff;border-radius:99px;overflow:hidden;margin-bottom:4px}.pbar i{display:block;height:100%;background:var(--c)}
.solved{font-size:13.5px;color:var(--mut)!important}
.pills{max-width:100%}.pill{min-width:36px}.pill.dn{background:rgba(255,255,255,.55);color:#fff}.pill.dn::after{content:'✓';margin-left:3px}.pill.on.dn{background:#fff;color:var(--c)}
.npad{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;max-width:320px;margin:8px auto}
.npad .key{border:0;border-radius:14px;background:#fff;font-size:26px;font-weight:800;padding:13px 0;cursor:pointer;box-shadow:0 3px 0 #d8d3f5}.npad .key.del{background:#ffe3e3;box-shadow:0 3px 0 #f2bcbc}.npad .key.ok{background:#2eaa5e;color:#fff;box-shadow:0 3px 0 #1f7d42}
.minisd{display:grid;grid-template-columns:repeat(4,38px);gap:3px}.minisd b{background:#fff;color:var(--c);height:38px;display:flex;align-items:center;justify-content:center;font-size:22px}
.minidd{font-size:28px;font-weight:900}.minidd u{background:#fff;color:var(--c);padding:0 8px;border-radius:6px;text-decoration:none}
.minich{font-size:48px}.mininim i{display:inline-block;width:22px;height:22px;border-radius:50%;background:#fff;margin:3px}
/* sudoku */
.kk-cell.rel{background:#f2f6ff}.kk-cell.same{background:#cfe0ff}.sd .kk-cell.sel{background:#ffe9a8}
.kk-cell.giv .kk-v{color:#2a6cc0}
/* digits */
.dd-eq{display:flex;flex-wrap:wrap;gap:6px 10px;justify-content:center;align-items:center;background:#fff;border-radius:20px;padding:22px 10px;box-shadow:0 4px 14px rgba(40,30,100,.08);margin:6px 0}
.dd-num{display:inline-flex;gap:4px}.dd-d{min-width:34px;height:48px;font-size:30px;font-weight:900;display:inline-flex;align-items:center;justify-content:center;border-radius:8px}
.dd-d.bl{border:3px dashed #e8478b;background:#fff0f7;color:#e8478b;cursor:pointer}.dd-d.bl.sel{background:#e8478b;color:#fff;border-style:solid}.dd-d.bl.lk{border-style:solid;background:#eef;color:#2a6cc0}
.dd-sym{font-size:30px;font-weight:900;color:var(--mut)}.dd-tip{background:#fff8e1;border-radius:12px;padding:8px 12px;font-size:14.5px;margin:8px 0}.dd-msg{min-height:44px}
/* euler */
.eu-svg{width:100%;max-width:520px;display:block;margin:0 auto;background:#fff;border-radius:20px;box-shadow:0 4px 14px rgba(40,30,100,.08);touch-action:manipulation}
.eu-e{fill:none;stroke:#c9c3e8;stroke-width:2.6;stroke-linecap:round}.eu-e.used{stroke:var(--gc);stroke-width:3.6}.eu-hit{fill:none;stroke:transparent;stroke-width:9;cursor:pointer}
.eu-v{fill:#1f1a3d;cursor:pointer}.eu-v.cur{fill:#ffb300;stroke:#1f1a3d;stroke-width:1.2}.eu-d{font-size:5px;font-weight:900;pointer-events:none;fill:#fff}
.eu-d.odd{fill:#fff;paint-order:stroke;stroke:#e5484d;stroke-width:3px}.eu-d.even{fill:#fff;paint-order:stroke;stroke:#2eaa5e;stroke-width:3px}
/* nim */
.nm-tip{background:#efeaff;border-radius:12px;padding:8px 12px;font-size:14.5px;margin-bottom:8px}.nm-turn{text-align:center;font-weight:800;font-size:18px;min-height:28px}.nm-turn.ai{color:#e8590c}
.nm-pile{display:flex;flex-wrap:wrap;gap:7px;justify-content:center;max-width:380px;margin:10px auto}.nm-count{text-align:center;font-weight:800;color:var(--mut)}
.stone{display:inline-block;width:30px;height:30px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#b8a4ff,#5f3dc4);box-shadow:0 3px 0 rgba(0,0,0,.2);transition:.25s;cursor:pointer}.stone.gone{opacity:.12;transform:scale(.6);cursor:default;box-shadow:none}.stone.sel{outline:4px solid #ffd23f}
.nm-piles{display:flex;flex-direction:column;gap:10px;margin:10px 0}.nm-row{display:flex;gap:7px;align-items:center;justify-content:center}.nm-lab{width:24px;font-weight:900;color:var(--mut);text-align:right}
.ch-board{display:flex;flex-direction:column;gap:4px;align-items:center;margin:12px 0}.ch-row{display:flex;gap:4px}.ch-c{width:62px;height:52px;border-radius:8px;background:linear-gradient(#8b5a2b,#5c3a1a);display:flex;align-items:center;justify-content:center;font-size:28px;cursor:pointer;box-shadow:inset 0 -4px 0 rgba(0,0,0,.25);transition:.2s}.ch-c.gone{opacity:0;pointer-events:none}.ch-c.poison{background:#2b2b2b;cursor:not-allowed}
.btn:disabled{opacity:.4;cursor:default}
/* chance */
.ch-vis{text-align:center;min-height:120px;display:flex;justify-content:center;align-items:center;flex-direction:column}.ch-svg{max-width:300px;width:100%}.ch-svg.sp{max-width:200px}.ch-big{font-size:80px}
.ch-q{background:#fff;border-radius:14px;padding:12px 14px;margin:8px 0;font-size:17px;line-height:1.4;box-shadow:0 2px 8px rgba(40,30,100,.06)}
.ch-in{min-height:56px;border-bottom:4px solid #d8d3f5;text-align:center;font-size:36px;font-weight:900;margin:6px 40px;color:#c2255c}.ch-in.good{border-color:#2eaa5e}.ch-in.bad{border-color:#e5484d}
.ch-grid{border-collapse:collapse;margin:0 auto}.ch-grid th,.ch-grid td{width:34px;height:28px;text-align:center;font-size:14px;border:1px solid #e0dcf5}.ch-grid th{background:#f2efff}.ch-grid td.hl{background:#ffd23f;font-weight:900}.ch-cap{font-size:12px;color:var(--mut);text-align:center;margin-top:3px}
/* derby */
.dy-lanes{display:flex;flex-direction:column;gap:5px;margin:8px 0}.dy-lane{display:flex;align-items:center;gap:6px;background:#fff;border-radius:10px;padding:3px 6px;border:3px solid transparent;cursor:pointer}.dy-lane.bet{border-color:#f59f00;background:#fff4d6}
.dy-n{width:30px;height:30px;border-radius:50%;background:#e67700;color:#fff;font-weight:900;display:flex;align-items:center;justify-content:center;flex:none}
.dy-track{position:relative;flex:1;height:30px;display:flex;gap:2px;align-items:center}.dy-track i{flex:1;height:8px;background:#e6e2fa;border-radius:4px}.dy-track i.on{background:#e67700}
.dy-h{position:absolute;top:2px;font-size:22px;transition:left .15s;transform:translateX(-30%)}.dy-fin{position:absolute;right:-4px;top:2px;font-size:18px}.dy-p{width:50px;font-size:12.5px;text-align:right}
.dy-dice{text-align:center;font-size:30px;min-height:44px;font-weight:700}
/* ---- batch 2 ---- */
.minibal{font-size:46px;text-align:center}
.bs-key,.bs .key,.ln .key,.pm .key{border:0;border-radius:12px;background:#fff;font-size:22px;font-weight:800;min-width:44px;padding:8px 12px;cursor:pointer;box-shadow:0 3px 0 #d8d3f5}
.ln .key:disabled{opacity:.3;cursor:default}
.bs{max-width:560px;margin:0 auto;text-align:center}.bs-eq{font-size:28px;font-weight:900;margin:6px 0;color:#5f3dc4}
.bs-scene{display:flex;align-items:flex-end;justify-content:center;gap:6px;min-height:150px;margin:10px 0}
.bs-pan{flex:1;min-height:90px;border-bottom:6px solid #7048e8;display:flex;flex-wrap:wrap;gap:4px;align-items:flex-end;justify-content:center;padding:6px;background:#f3f0ff;border-radius:12px 12px 0 0}
.bs-beam{width:22px;align-self:flex-end}.bs-fulc{font-size:26px;color:#7048e8;line-height:1}
.bx{background:#7048e8;color:#fff;border-radius:8px;width:34px;height:34px;display:inline-flex;align-items:center;justify-content:center;font-weight:900;font-style:italic}
.bu{background:#ffd43b;color:#5c4400;border-radius:50%;width:26px;height:26px;display:inline-flex;align-items:center;justify-content:center;font-weight:800;font-size:13px}
.bu.neg{background:#ff8787;color:#fff}.bu.big{border-radius:10px;width:auto;padding:0 10px;height:30px;font-size:16px}.bu.empty{background:#e9e5fb;color:#8a82b8}
.bs-k{margin:8px 0;font-size:20px;font-weight:700;display:flex;gap:10px;justify-content:center;align-items:center}

  const c=el('canvas','confetti');document.body.appendChild(c);c.width=innerWidth;c.height=innerHeight;
  const g=c.getContext('2d'),cols=['#ff7a45','#7c5cff','#17a2b8','#e8478b','#2eaa5e','#f5b301'];

/* reusable number pad: returns element; onKey gets '0'-'9','-','.','del','ok' */
function numpad(onKey,opts={}){
  const p=el('div','npad');
  const keys=['7','8','9','4','5','6','1','2','3',opts.minus?'-':(opts.slash?'/':'del'),'0',opts.minus||opts.slash?'del':'ok'];
  keys.forEach(k=>{const b=el('button','key'+(k==='del'?' del':''),k==='del'?'⌫':k==='-'?'−':k==='ok'?'✓':k);b.onclick=()=>onKey(k);p.appendChild(b);});
  if(opts.minus||opts.slash){const b=el('button','key ok','Enter ✓');b.style.gridColumn='span 3';b.onclick=()=>onKey('ok');p.appendChild(b);}
  return p;
}

function parseCode(c){try{c=c.trim();if(!c.startsWith('PZ1:'))return null;const o=JSON.parse(decodeURIComponent(escape(atob(c.slice(4)))));if(!o||typeof o.n!=='string'||typeof o.p!=='number')return null;o.n=o.n.slice(0,16);return o;}catch(e){return null;}}

/* ---------- accounts, cloud sync, event log ---------- */
const PZC=window.PZ_CFG||{url:'',key:''};
const CLOUD=!!(PZC.url&&PZC.key);
let SYNC=CLOUD?'ok':'local';
const LS={get(k,d){try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v)}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};

/* sha-256 (WebCrypto when available, small JS fallback otherwise) */
function sha256js(m){const K=[];let p=2,n=0;const H=[];
  const isP=x=>{for(let i=2;i*i<=x;i++)if(x%i===0)return false;return true};
  while(n<64){if(isP(p)){if(n<8)H[n]=(Math.pow(p,.5)*4294967296)|0;K[n++]=(Math.pow(p,1/3)*4294967296)|0;}p++;}
  const b=unescape(encodeURIComponent(m)),l=b.length*8,w=[];
  for(let i=0;i<b.length;i++)w[i>>2]|=b.charCodeAt(i)<<(24-(i%4)*8);
  w[l>>5]|=0x80<<(24-l%32);w[(((l+64)>>9)<<4)+15]=l;
  for(let j=0;j<w.length;j+=16){const x=w.slice(j,j+16);let [a,b2,c,d,e,f,g,h]=H;
    for(let i=0;i<64;i++){if(i>=16){const g0=x[i-15],g1=x[i-2];x[i]=(x[i-16]+(((g0>>>7)|(g0<<25))^((g0>>>18)|(g0<<14))^(g0>>>3))+x[i-7]+(((g1>>>17)|(g1<<15))^((g1>>>19)|(g1<<13))^(g1>>>10)))|0;}
      const t1=(h+(((e>>>6)|(e<<26))^((e>>>11)|(e<<21))^((e>>>25)|(e<<7)))+((e&f)^(~e&g))+K[i]+x[i])|0,
      t2=((((a>>>2)|(a<<30))^((a>>>13)|(a<<19))^((a>>>22)|(a<<10)))+((a&b2)^(a&c)^(b2&c)))|0;
      h=g;g=f;f=e;e=(d+t1)|0;d=c;c=b2;b2=a;a=(t1+t2)|0;}
    H[0]=(H[0]+a)|0;H[1]=(H[1]+b2)|0;H[2]=(H[2]+c)|0;H[3]=(H[3]+d)|0;H[4]=(H[4]+e)|0;H[5]=(H[5]+f)|0;H[6]=(H[6]+g)|0;H[7]=(H[7]+h)|0;}
  return H.map(v=>('00000000'+(v>>>0).toString(16)).slice(-8)).join('');}
async function sha256hex(str){
  try{if(window.crypto&&crypto.subtle){const d=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(str));return [...new Uint8Array(d)].map(x=>x.toString(16).padStart(2,'0')).join('');}}catch(e){}
  return sha256js(str);}
const pinHash=(name,pin)=>sha256hex('pz1:'+name.toLowerCase()+':'+pin);
const cleanName=n=>n.trim().replace(/\s+/g,' ').toUpperCase();
const validName=n=>/^[\p{L}\p{N}_ ]{2,16}$/u.test(n);

/* ---------- cloud calls ---------- */
async function rpc(fn,args){
  try{
    const r=await fetch(PZC.url.replace(/\/$/,'')+'/rest/v1/rpc/'+fn,{method:'POST',headers:Object.assign({'Content-Type':'application/json',apikey:PZC.key},PZC.key.startsWith('sb_')?{}:{Authorization:'Bearer '+PZC.key}),body:JSON.stringify(args)});
    if(!r.ok)return{ok:false,error:'server'};
    return await r.json();
  }catch(e){return{ok:false,error:'network'};}
}

/* ---------- merge two progress blobs ---------- */
function mergeData(a,b){
  const out={done:{},rv:{}};
  [a,b].forEach(src=>{if(!src)return;
    for(const id in (src.done||{}))for(const l in src.done[id]){
      const r=src.done[id][l],cur=((out.done[id]=out.done[id]||{})[l]);
      if(!cur)out.done[id][l]=Object.assign({},r);
      else{const best=(r.n||0)>(cur.n||0)||((r.n||0)===(cur.n||0)&&(r.p||0)>(cur.p||0))?r:cur;
        const t=[cur.t,r.t].filter(x=>x!=null);out.done[id][l]=Object.assign({},best,{t:t.length?Math.min(...t):null});}
    }
    for(const k in (src.rv||{}))if(out.rv[k]==null)out.rv[k]=src.rv[k];
  });
  return out;
}
const dataOf=u=>({v:2,done:u.done,rv:u.rv||{}});

/* ---------- session ---------- */
const getSess=()=>LS.get('pz-sess',null);
const setSess=s=>{if(s)LS.set('pz-sess',s);else try{localStorage.removeItem('pz-sess')}catch(e){}};

function adoptUser(name,remoteData,h,legacyMerge){
  let u=DB.users[name];
  if(!u)u=DB.users[name]={created:Date.now(),done:{},rv:{},ev:[]};
  const m=mergeData(u,remoteData);u.done=m.done;u.rv=m.rv;u.h=CLOUD?undefined:h;if(!u.ev)u.ev=[];
  if(legacyMerge){const g=DB.users.Guest;if(g){const m2=mergeData(u,g);u.done=m2.done;u.rv=m2.rv;delete DB.users.Guest;}}
  DB.cur=name;done=u.done;
  setSess({name,h});LS.set('pz-last',name);persist();
}

async function nameFree(nameRaw){
  const name=cleanName(nameRaw);if(!validName(name))return{ok:false,state:'bad'};
  if(CLOUD){const r=await rpc('pz_name_free',{p_name:name});if(r&&r.ok)return{ok:true,state:r.free?'free':'taken'};return{ok:false,state:'unknown'};}
  return{ok:true,state:Object.keys(DB.users).some(k=>k.toLowerCase()===name.toLowerCase()&&k!=='Guest')?'taken':'free'};
}
async function doRegister(nameRaw,pin){
  const name=cleanName(nameRaw);
  if(!validName(name))return{ok:false,msg:'Name must be 2–16 letters or numbers.'};
  if(!/^\d{4}$/.test(pin))return{ok:false,msg:'PIN must be exactly 4 digits.'};
  const h=await pinHash(name,pin);
  let migrate=false;
  if(DB.users.Guest&&Object.keys(DB.users.Guest.done||{}).length)migrate=confirm('Move the progress saved under “Guest” on this device into your new account?');
  if(CLOUD){
    const r=await rpc('pz_register',{p_name:name,p_hash:h,p_data:{v:2,done:{},rv:{}}});
    if(!r.ok)return{ok:false,msg:r.error==='taken'?'That name is already taken. Please choose another one.':r.error==='network'?'Cannot reach the server. Check your internet and try again.':r.error==='bad_name'?'Name must be 2–16 letters or numbers.':'Could not register. Please try again.'};
    adoptUser(r.name||name,null,h,migrate);
  }else{
    if(Object.keys(DB.users).some(k=>k.toLowerCase()===name.toLowerCase()&&k!=='Guest'))return{ok:false,msg:'That name is already taken on this device. Please choose another one.'};
    adoptUser(name,null,h,migrate);
  }
  return{ok:true,name:DB.cur};
}
async function doLogin(nameRaw,pin){
  const name=cleanName(nameRaw);
  if(!name)return{ok:false,msg:'Please type your name.'};
  if(!/^\d{4}$/.test(pin))return{ok:false,msg:'PIN must be exactly 4 digits.'};
  const h=await pinHash(name,pin);
  if(CLOUD){
    const r=await rpc('pz_login',{p_name:name,p_hash:h});
    if(!r.ok)return{ok:false,msg:r.error==='no_user'?'No player with that name. Tap “New player” to register.':r.error==='bad_pin'?'Wrong PIN. Try again.':r.error==='locked'?'Too many wrong tries. Please wait 5 minutes.':r.error==='network'?'Cannot reach the server. Check your internet and try again.':'Could not log in. Please try again.'};
    adoptUser(r.name||name,r.data,h,false);
  }else{
    const key=Object.keys(DB.users).find(k=>k.toLowerCase()===name.toLowerCase()&&k!=='Guest');
    if(!key)return{ok:false,msg:'No player with that name on this device. Tap “New player” to register.'};
    const u=DB.users[key];
    if(u.h){if(u.h!==h)return{ok:false,msg:'Wrong PIN. Try again.'};}
    else if(u.pin){if(u.pin!==pin)return{ok:false,msg:'Wrong PIN. Try again.'};}
    adoptUser(key,null,h,false);
  }
  return{ok:true,name:DB.cur};
}
function logout(){setSess(null);DB.cur=null;done={};persist();renderMenu();if(ctx)goMenu();showLogin(true);}

/* ---------- login / register dialog (cannot be dismissed) ---------- */
function showLogin(first){
  document.querySelectorAll('.overlay').forEach(o=>o.remove());
  let mode=LS.get('pz-last',null)||Object.keys(DB.users).some(k=>k!=='Guest')?'in':'new';
  const o=ov('','login');const box=o.querySelector('.modal');
  function draw(){
    box.innerHTML=`<div class="big-emo">👋</div><h2>${mode==='in'?'Welcome back!':'Create your player'}</h2>
     <div class="seg"><button class="${mode==='in'?'on':''}" data-m="in">Log in</button><button class="${mode==='new'?'on':''}" data-m="new">New player</button></div>
     <input id="un" class="tin" maxlength="16" placeholder="YOUR NAME (CAPITAL LETTERS)" autocomplete="username" autocapitalize="characters" value="${mode==='in'?esc(LS.get('pz-last','')):''}">
     ${mode==='new'?'<div class="avail" id="avail">&nbsp;</div>':''}
     <input id="up" class="tin" type="password" maxlength="4" inputmode="numeric" pattern="[0-9]*" placeholder="4-digit PIN" autocomplete="${mode==='in'?'current-password':'new-password'}">
     ${mode==='new'?'<input id="up2" class="tin" type="password" maxlength="4" inputmode="numeric" pattern="[0-9]*" placeholder="Type the PIN again" autocomplete="off"><p class="small">Names are always in CAPITAL LETTERS. Pick a name nobody else uses and a PIN you can remember. Your PIN keeps your progress safe.</p>':''}
     <div class="msg" id="lmsg">&nbsp;</div><div class="row"><button class="btn" id="go">${mode==='in'?'Log in ▶':'Register & play ▶'}</button></div>
     <p class="small">${CLOUD?'☁ Your progress is saved online.':'📱 Your progress is saved on this device only.'}</p>`;
    box.querySelectorAll('.seg button').forEach(b=>b.onclick=()=>{mode=b.dataset.m;draw();});
    const go=async()=>{
      const n=$('#un',box).value,p=$('#up',box).value.trim(),msg=$('#lmsg',box),btn=$('#go',box);
      if(mode==='new'&&p!==$('#up2',box).value.trim()){msg.textContent='The two PINs are not the same.';return;}
      btn.disabled=true;msg.textContent='Please wait…';
      const r=mode==='in'?await doLogin(n,p):await doRegister(n,p);
      btn.disabled=false;
      if(!r.ok){msg.textContent=r.msg;return;}
      o.remove();renderMenu();toast('Hi '+r.name+'! 👋');
      if(CLOUD){flushEvents();}
    };
    const un=$('#un',box);un.oninput=()=>{const a=un.selectionStart,z=un.selectionEnd;un.value=un.value.toUpperCase();try{un.setSelectionRange(a,z)}catch(e){}};
    if(mode==='new'){let tm=null,seq=0;const av=$('#avail',box);
      const chk=()=>{clearTimeout(tm);const v=un.value.trim();if(!v){av.className='avail';av.innerHTML='&nbsp;';return;}av.className='avail';av.textContent='Checking…';
        tm=setTimeout(async()=>{const my=++seq,r=await nameFree(v);if(my!==seq)return;
          av.className='avail '+(r.state==='free'?'ok':'bad');
          av.textContent=r.state==='free'?'✅ This name is free':r.state==='taken'?'❌ This name is already taken — try another':r.state==='bad'?'Use 2–16 letters or numbers':'Could not check the name right now';},450);};
      un.addEventListener('input',chk);}
    $('#go',box).onclick=go;box.querySelectorAll('input').forEach(i=>i.onkeydown=e=>{if(e.key==='Enter')go();});
  }
  draw();
}

/* ---------- profile ---------- */

function showProfile(){

/* ---------- teacher board ---------- */
function showClass(){
  if(!CLOUD)return showClassLocal();
  const key=LS.get('pz-tkey','');
  const o=ov(`<h2>🏫 Teacher board</h2><p class="small">Enter the teacher key to see every player.</p>
   <input id="tk" class="tin" type="password" placeholder="Teacher key" value="${esc(key)}"><div class="msg" id="tmsg">&nbsp;</div>
   <div class="row"><button class="btn" id="tgo">Show players</button><button class="btn alt" id="tx">Close</button></div><div id="tout"></div>`,'big');
  $('#tx',o).onclick=()=>o.remove();
  $('#tgo',o).onclick=async()=>{
    const k=$('#tk',o).value;$('#tmsg',o).textContent='Loading…';
    const r=await rpc('pz_admin',{p_key:k});
    if(!r||r.ok===false){$('#tmsg',o).textContent=r&&r.error==='bad_key'?'Wrong teacher key.':'Could not load. Try again.';return;}
    LS.set('pz-tkey',k);$('#tmsg',o).innerHTML='&nbsp;';
    const list=(r.players||[]).map(p=>{const d=(p.data&&p.data.done)||{};let pts=0,lv=0;const g={};for(const id in d){g[id]=Object.keys(d[id]).length;lv+=g[id];for(const l in d[id])pts+=d[id][l].p||0;}
      return{n:p.name,p:pts,l:lv,g,seen:p.last_seen};}).sort((a,b)=>b.p-a.p);
    const ago=t=>{if(!t)return '–';const m=Math.round((Date.now()-new Date(t))/60000);return m<60?m+' min ago':m<1440?Math.round(m/60)+' h ago':Math.round(m/1440)+' d ago';};

// shared 5-question quiz engine (pass 4/5)
function mountQuiz(root,ctx,o){
  let qs,qi,right,cur,buf,answered;
  const start=()=>{qs=Array.from({length:5},()=>pick(o.pool));qi=0;right=0;next();};
  const next=()=>{cur=o.QT[qs[qi]]();buf='';answered=false;draw();};
  function draw(msg,ok){
    root.innerHTML=`<div class="ch"><div class="statrow"><span>Question ${qi+1}/5</span><span>✅ ${right} correct (need 4)</span></div>
     <div class="ch-vis">${cur.vis||''}</div><div class="ch-q">${cur.q}</div>
     <div class="ch-in ${ok===true?'good':ok===false?'bad':''}">${buf||'&nbsp;'}</div>
     <div class="msg">${msg||'&nbsp;'}</div><div id="chp"></div>
     <div class="toolrow">${answered?`<button class="btn" id="nx">${qi<4?'Next question ▶':'See result ▶'}</button>`:''}</div></div>`;
    if(!answered)$('#chp').appendChild(numpad(press,{slash:!!o.slash}));
    if($('#nx'))$('#nx').onclick=advance;
  }
  function press(k){
    if(answered)return;
    if(k==='del')buf=buf.slice(0,-1);else if(k==='ok')return submit();else if(buf.length<12)buf+=k;
    draw();
  }
  function submit(){
    const p=o.parse(buf);if(!p){draw(o.slash?'Type an answer first, e.g. 3/10':'Type an answer first');return;}
    answered=true;
    let ok=Math.abs(p.v-cur.ans)<1e-6;
    if(ok&&cur.simplest&&p.n!=null&&gcd(p.n,p.d)!==1)ok=false,cur.ex='Right value, but the answer must be in its simplest form. '+cur.ex;
    if(ok)right++;
    draw((ok?'✅ Correct! ':'❌ Not quite. ')+cur.ex,ok);
  }
  function advance(){
    if(qi<4){qi++;next();return;}
    if(right>=4)ctx.win(o.winTitle||'Well done!',`You got ${right}/5 right.`,start,'Play again');
    else{root.innerHTML=`<div class="ch"><div class="big-emo" style="text-align:center">💪</div><div class="ch-q" style="text-align:center">You got ${right}/5. You need 4 to pass — have another go!</div><div class="toolrow"><button class="btn" id="rt">Try again</button></div></div>`;$('#rt').onclick=start;}
  }
  ctx.keys=e=>{if(/^[0-9.]$/.test(e.key)||(o.slash&&e.key==='/'))press(e.key);else if(e.key==='Backspace'){e.preventDefault();press('del');}else if(e.key==='Enter')press('ok');};
  start();
  return{QT:o.QT};
}

 {t:'sub',n:10,S:[1,2,3],name:'Take 1, 2 or 3 from 10',tip:'Aim to leave a multiple of 4 (4, 8, 12…).'},
 {t:'sub',n:13,S:[1,2,3],name:'Take 1, 2 or 3 from 13',tip:'Multiples of 4 are the safe numbers to leave.'},
 {t:'sub',n:17,S:[1,2,3,4],name:'Take 1 to 4 from 17',tip:'Now the safe numbers are multiples of 5.'},
 {t:'sub',n:23,S:[1,2,3,4,5],name:'Take 1 to 5 from 23',tip:'Safe numbers: multiples of 6. Can you see the pattern: max take + 1?'},
 {t:'sub',S:[1,3,4],auto:12,name:'Odd rules: take 1, 3 or 4',tip:'The pattern is different now! Work backwards from 0: which piles are safe to leave?'},
 {t:'sub',S:[2,3,5],auto:15,name:'Odd rules: take 2, 3 or 5',tip:'Work backwards from 0 and 1 (you can’t move from 0 or 1!).'},
 {t:'nim',piles:[3,5],name:'Nim · two piles (3, 5)',tip:'Take from one pile only. Try to make the piles equal.'},
 {t:'nim',piles:[3,4,5],name:'Nim · three piles (3, 4, 5)',tip:'Write the pile sizes in binary and add each column without carrying (XOR). Make it zero!'},

 {t:'nim',piles:[3,4,6],misere:true,name:'Misère Nim · last stone LOSES',tip:'Play like normal Nim until every pile has just 1 stone, then flip the plan!'}

function startPile(sp){const g=mk(sp);for(let n=sp.auto;n<40;n++){g.memo.clear();if(g.win(n))return n;}return sp.auto;}
window.__nim={mk,SPECS};
REG.push({id:'nim',name:'Strategy Duel',emoji:'🎲',color:'#5f3dc4',cat:'Strategy',
 desc:'Beat the computer at classic maths games: Nim, Chomp and subtraction races. It plays perfectly — can you find the winning strategy?',skills:['game theory','patterns','working backwards'],
 levels:SPECS.map(s=>s.name),
 how:'You always move first, and a winning strategy exists for you. The computer never makes a mistake when it can win — so if you slip, it will punish you! Use 💡 if you get stuck.',
 art:'<div class="mininim"><i></i><i></i><i></i><br><i></i><i></i><br><i></i></div>',
 mount(root,lv,ctx){
  const sp={...SPECS[lv-1]};if(sp.t==='sub'&&sp.auto)sp.n=startPile(sp);
  const G=mk(sp);let st,turn,sel=null,hist,over,msg='',lastAI=null;
  function reset(){st=G.start();turn='h';sel=null;hist=[];over=false;msg='Your move!';lastAI=null;draw();}
  function draw(){
    let body='';
    if(sp.t==='sub'){
      body=`<div class="nm-pile">${Array.from({length:sp.n},(_,i)=>`<span class="stone${i<st?'':' gone'}"></span>`).join('')}</div><div class="nm-count">${st} left</div>
       <div class="toolrow">${sp.S.map(k=>`<button class="btn takebtn" data-k="${k}" ${turn!=='h'||over||k>st?'disabled':''}>Take ${k}</button>`).join('')}</div>`;
    }else if(sp.t==='nim'){
      body='<div class="nm-piles">'+st.map((p,r)=>`<div class="nm-row"><span class="nm-lab">${p}</span>${Array.from({length:sp.piles[r]},(_,j)=>`<span class="stone${j<p?'':' gone'}${sel&&sel.r===r&&j>=sel.j&&j<p?' sel':''}" data-r="${r}" data-j="${j}"></span>`).join('')}</div>`).join('')+'</div>'+
        `<div class="toolrow"><button class="btn" id="take" ${sel&&!over&&turn==='h'?'':'disabled'}>${sel?`Take ${st[sel.r]-sel.j} from pile ${sel.r+1}`:'Tap a stone to choose'}</button></div>`;
    }else{
      body='<div class="ch-board">'+st.map((len,r)=>`<div class="ch-row">${Array.from({length:sp.c},(_,c)=>`<span class="ch-c${c<len?'':' gone'}${!r&&!c?' poison':''}" data-r="${r}" data-c="${c}">${!r&&!c?'💀':''}</span>`).join('')}</div>`).join('')+'</div>';
    }
    root.innerHTML=`<div class="nm"><div class="nm-tip">${sp.tip}</div><div class="nm-turn ${turn==='h'?'me':'ai'}">${over?'':turn==='h'?'🙂 Your turn':'🤖 Computer thinking…'}</div>${body}<div class="msg">${msg||'&nbsp;'}</div>
      <div class="toolrow"><button class="btn alt" id="un">↶ Undo</button><button class="btn alt" id="hn">💡 Hint</button><button class="btn alt" id="rs">⟲ Restart</button></div></div>`;
    root.querySelectorAll('.takebtn').forEach(b=>b.onclick=()=>human(+b.dataset.k));
    root.querySelectorAll('.nm-row .stone').forEach(s=>s.onclick=()=>{if(turn!=='h'||over||s.classList.contains('gone'))return;sel={r:+s.dataset.r,j:+s.dataset.j};draw();});
    if($('#take'))$('#take').onclick=()=>{human([sel.r,st[sel.r]-sel.j]);};
    root.querySelectorAll('.ch-c').forEach(c=>c.onclick=()=>{if(turn!=='h'||over||c.classList.contains('gone'))return;
      const m=[+c.dataset.r,+c.dataset.c];if(m[0]===0&&m[1]===0){msg='That’s the poisoned square — you’d lose! Pick another.';draw();return;}human(m);});
    $('#un').onclick=()=>{if(turn!=='h'||over||!hist.length)return;st=hist.pop();sel=null;msg='Undone — your move!';draw();};
    $('#rs').onclick=reset;
    $('#hn').onclick=()=>{if(turn!=='h'||over)return;const b=G.best(st);
      if(!b.length){msg='Uh-oh: every move loses against perfect play. Undo, and look for the mistake earlier!';}
      else{const m=b[0];msg='💡 '+(sp.t==='sub'?`Take ${m}.`:sp.t==='nim'?`Take ${m[1]} from pile ${m[0]+1}.`:`Eat the square in row ${m[0]+1}, column ${m[1]+1}.`);}
      draw();};
  }
  function human(m){
    if(turn!=='h'||over)return;
    hist.push(Array.isArray(st)?st.slice():st);st=G.apply(st,m);sel=null;
    if(G.empty(st)){return finish('h');}
    if(G.win(st))msg='Hmm — that move gave the computer the upper hand. You can Undo!';else msg='Good move! The computer is stuck in a losing position…';
    turn='a';draw();
    ctx.timeout(()=>{
      const good=G.best(st),ms=G.moves(st),mv=good.length?good[R(0,good.length-1)]:ms[R(0,ms.length-1)];
      st=G.apply(st,mv);
      msg='The computer moved: '+(sp.t==='sub'?`took ${mv}`:sp.t==='nim'?`took ${mv[1]} from pile ${mv[0]+1}`:`ate row ${mv[0]+1}, column ${mv[1]+1}`);
      if(G.empty(st))return finish('a');turn='h';draw();
    },900);
  }
  function finish(last){
    over=true;turn='h';
    const humanWins=sp.misere?last==='a':last==='h';
    if(humanWins){msg='🏆 You win!';draw();ctx.win('You beat the computer!','You found the winning strategy. Can you explain it to a friend?',reset,'Play again');}
    else{msg='The computer wins this time. Press Restart and look for the safe positions!';draw();}
  }
  ctx.keys=null;reset();
 }});
})();

 mount(root,lv,ctx){
  const spec=LV[lv-1];let terms,orig,L,CF,chains,tok,selI,selJ,buf,steps,ended;const timers=[];
  root.innerHTML=`<div class="fx" id="fxr"><div class="fx-top" id="fxt"></div><div class="fx-stage" id="fxs"></div><div class="msg" id="fxm">&nbsp;</div>
   <div class="toolrow"><button class="btn alt" id="fxh">💡 Hint</button><button class="btn alt" id="fxn">New question ⏭</button></div></div><div class="fxp" id="fxpad" style="display:none"></div>`;
  const msg=h=>{const a=$('#fxm'),b=$('#fxpm');if(a)a.innerHTML=h||'&nbsp;';if(b)b.innerHTML=h||'&nbsp;';};
  const cp=ts=>ts.map(t=>({c:t.c,p:Object.assign({},t.p)}));
  const clearTimers=()=>{timers.splice(0).forEach(clearTimeout);};
  const absT=t=>({c:Math.abs(t.c),p:Object.assign({},t.p)});
  function build(){
    let q;do{q=gen(spec);}while(!q);
    const set=spec.L===1?[pick(SETS1)]:pick(SETS2),mp={x:set[0],y:set[1]||set[0]};
    terms=q.terms.map(t=>{const p={};for(const k in t.p){const nk=mp[k]||k;p[nk]=(p[nk]||0)+t.p[k];}return{c:t.c,p};});
    L=[...new Set(terms.flatMap(t=>Object.keys(t.p)))].sort();
    orig=cp(terms);CF={c:1,p:{}};steps=[];ended=false;selI=-1;selJ=-1;msg('');startRound();
  }
  function startRound(){clearTimers();chains=terms.map(t=>[absT(t)]);tok=terms.map(()=>0);selI=-1;selJ=-1;buf='';render();closePad();}
  const shownBuf=()=>buf.replace(/\^2/g,'²').replace(/\^3/g,'³');
  const tkTxt=tk=>fmtT(tk,true);
  const leadOf=(t,i)=>t.c<0?(i===0?'−':'− '):(i===0?'':'+ ');
  function commonD(){
    if(!chains)return null;const keyOf=tk=>tkTxt(tk);
    const cnts=chains.map(ch=>{const m={};ch.forEach(tk=>{const k=keyOf(tk);m[k]=(m[k]||0)+1;});return m;});
    let D={c:1,p:{}},any=false;
    Object.keys(cnts[0]).forEach(k=>{const n=Math.min(...cnts.map(m=>m[k]||0));if(n>0){const tk=chains[0].find(x=>keyOf(x)===k);for(let r=0;r<n;r++){D=mulT(D,tk);any=true;}}});
    return any?D:null;
  }
  const commonBlk=()=>{const d=commonD();return d?fmtT(d,true):null;};
  function comMap(){ // which tokens are the common factor
    const d=ended?null:commonD();const res=chains.map(ch=>ch.map(()=>false));if(!d)return res;
    const cnts=chains.map(ch=>{const m={};ch.forEach(tk=>{const k=tkTxt(tk);m[k]=(m[k]||0)+1;});return m;});
    const need={};Object.keys(cnts[0]).forEach(k=>{const n=Math.min(...cnts.map(m=>m[k]||0));if(n>0)need[k]=n;});
    chains.forEach((ch,i)=>{const left=Object.assign({},need);ch.forEach((tk,j)=>{const k=tkTxt(tk);if(left[k]>0){left[k]--;res[i][j]=true;}});});
    return res;
  }
  const pills=ts=>{const cm=comMap();return ts.map((t,i)=>`<span class="fx-tw">${leadOf(t,i)}${chains[i].map((tk,j)=>`<span class="fx-tk${!ended&&i===selI&&j===selJ?' cur':''}${cm[i][j]?' com':''}" data-i="${i}" data-j="${j}">${tkTxt(tk)}</span>`).join('<span class="fx-x"> × </span>')}</span>`).join(' ');};
  function topHtml(){
    const btn='';
    let h=`<div class="fx-expr">${steps.length?fmtExpr(orig):pills(terms)+btn}</div>`;
    steps.forEach((s,k)=>{const last=k===steps.length-1;
      h+=`<div class="fx-step${last?' last':''}">= <span class="fx-out">${fmtT(s.CF,true)}</span>(${last&&!ended?pills(s.terms):fmtExpr(s.terms)})${last&&!ended?btn:''}</div>`;});
    return h;
  }
  function render(){
    $('#fxt').innerHTML=topHtml();updV();
    $('#fxt').querySelectorAll('.fx-tk').forEach(e=>e.onclick=()=>{if(e.classList.contains('com'))doFactorise();else openPad(+e.dataset.i,+e.dataset.j);});
    $('#fxt').querySelectorAll('.fx-tw').forEach(w=>{const i=[...$('#fxt').querySelectorAll('.fx-tw')].indexOf(w);w.querySelectorAll('.fx-x').forEach((x,j)=>x.onclick=()=>merge(i,j));});
    $('#fxs').innerHTML=ended?`<div class="ex-res"><span class="ex-eq">Fully factorised! Nothing more can be taken out.</span></div>`:'';
  }
  function openPad(i,j){
    if(ended)return;selI=i;selJ=j;buf='';const pad=$('#fxpad');
    pad.style.display='';$('#fxr').classList.add('padopen');
    pad.innerHTML=`<div class="fxp-h"><span class="fxp-t">Factors of <b>${tkTxt(chains[i][j])}</b></span><span class="fxp-v" id="fxv"></span><button class="fxp-x" id="fxx">✕</button></div><div class="msg" id="fxpm">&nbsp;</div><div class="ex-pad" id="fxk"></div>`;
    $('#fxx').onclick=closePad;
    ['7','8','9','del','4','5','6','sq2','1','2','3','sq3','0',...L].forEach(k=>{const b=el('button','key'+(k==='del'?' del':'')+(L.includes(k)?' var':''),k==='del'?'⌫':k==='sq2'?'²':k==='sq3'?'³':k);b.onclick=()=>press(k);$('#fxk').appendChild(b);});
    const ok=el('button','key ok','Add ✓');ok.style.gridColumn='1 / -1';ok.onclick=()=>press('ok');$('#fxk').appendChild(ok);
    render();
    setTimeout(()=>{const t=document.getElementById('fxt');if(t)window.scrollBy(0,t.getBoundingClientRect().top-12);},30);
  }
  function closePad(){const pad=$('#fxpad');if(!pad)return;pad.style.display='none';pad.innerHTML='';const r=$('#fxr');if(r)r.classList.remove('padopen');if(selI!==-1){selI=-1;selJ=-1;buf='';if(terms&&chains)render();}}
  function updV(){const v=document.getElementById('fxv');if(v)v.textContent=shownBuf();}
  function press(k){
    if(ended||selI<0||document.querySelector('.overlay'))return;
    if(k==='del')buf=/\^[23]$/.test(buf)?buf.slice(0,-2):buf.slice(0,-1);
    else if(k==='sq2'||k==='sq3'){if(/[a-z]$/.test(buf))buf+='^'+k[2];}
    else if(L.includes(k)){if(!buf.includes(k))buf+=k;}
    else if(k==='ok')return add();
    else if(/^\d$/.test(k)){if(!/[a-z]/.test(buf)&&buf.length<3)buf+=k;}
    updV();
  }
  function touch(i){const my=++tok[i];timers.push(setTimeout(()=>{if(tok[i]===my&&chains[i].length>1){chains[i]=[absT(terms[i])];render();}},30000));}
  function add(){
    const i=selI,j=selJ,tk=chains[i][j];
    const m=buf?parseMono(buf,L):null;
    if(!m||m.c<1){msg('Enter a number, letters, or both (like 9, n or 9n). Use ² for a square.');return;}
    const blk={c:m.c,p:m.p},canon=fmtT(blk,true);
    if(blk.c===1&&!Object.keys(blk.p).length){msg('1 divides everything, so it is no use here.');buf='';return updV();}
    if(!divides(blk,tk)){
      const bad=Math.abs(tk.c)%blk.c!==0?`${blk.c} does not divide ${tk.c} exactly.`:`${canon} is not part of ${tkTxt(tk)}.`;
      msg('❌ '+bad);ctx.log('wrong',{stage:'split',term:fmtT(terms[i],true),part:tkTxt(tk),typed:canon,type:'not_a_factor'});buf='';return updV();}
    const rest=divT(tk,blk);
    if(rest.c===1&&!Object.keys(rest.p).length){msg(`${canon} is the whole thing — enter a smaller factor.`);buf='';return updV();}
    chains[i].splice(j,1,blk,rest);touch(i);buf='';selI=-1;selJ=-1;closePad();render();
    const d=commonD();msg(d?`✅ ${fmtT(d,true)} is in every term — tap the green factor!`:`✅ ${tkTxt(tk)} = ${canon} × ${fmtT(rest,true)}`);
  }
  function merge(i,j){
    if(ended)return;const a=chains[i][j],b=chains[i][j+1];if(!a||!b)return;
    chains[i].splice(j,2,mulT(a,b));if(chains[i].length>1)touch(i);selI=-1;selJ=-1;if(document.getElementById('fxpad').style.display!=='none')closePad();render();msg('');
  }
  function doFactorise(){
    const blk=commonD();if(!blk||ended)return;const cb=fmtT(blk,true);
    CF=mulT(CF,blk);terms=terms.map(t=>divT(t,blk));
    steps.push({CF:{c:CF.c,p:Object.assign({},CF.p)},terms:cp(terms)});clearTimers();
    const cm=common(terms);
    if(cm.c===1&&!Object.keys(cm.p).length){ended=true;selI=-1;closePad();render();msg(`✅ Factorised by ${cb} — nothing more to take out!`);return finish();}
    startRound();msg(`✅ Factorised by ${cb}. Is there more to take out?`);
  }
  function finish(){const res=`${fmtT(CF,true)}(${fmtExpr(terms)})`;
    ctx.timeout(()=>ctx.win('Factorised!',`${fmtExpr(orig)} = ${res}`,build,'New question'),1000);}
  $('#fxh').onclick=()=>msg('💡 Tap a part of a term and enter one of its factors (a number like 3, a letter like n, or both like 3n). Keep splitting until the SAME factor shows up in every term, then tap the green factor.');
  $('#fxn').onclick=build;
  ctx.cleanups&&ctx.cleanups.push(()=>{clearTimers();const p=document.getElementById('fxpad');if(p)p.remove();});
  ctx.keys=e=>{const k=e.key.toLowerCase();if(k==='escape')return closePad();if(/^[0-9]$/.test(k))press(k);else if(L&&L.includes(k))press(k);else if(k==='^')press('sq2');else if(k==='backspace')press('del');else if(k==='enter')press('ok');};
  window.__fxq=()=>({get terms(){return terms},get chains(){return chains},get ended(){return ended},get steps(){return steps},get CF(){return CF},press,select:openPad,close:closePad,common,commonBlk,factorise:doFactorise,merge,reqTok:(i,j)=>reqOf(chains[i][j]),expire:i=>{chains[i]=[absT(terms[i])];render();}});
  build();
 }});
})();


renderMenu();bootAccount();if(window.__GAME_PAGE)routeNow();</script></body></html>
